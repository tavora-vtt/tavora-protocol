syntax = "proto3";

package tavora.v1;

option go_package = "github.com/tavora-vtt/tavora-protocol/gen/go/tavora/v1;tavorav1";

message Frame {
  uint32 lane = 1;

  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    Intent intent = 12;
    Ack ack = 13;
    Event event = 14;
    Ephemeral ephemeral = 15;
    Error error = 16;
    Ping ping = 17;
    Pong pong = 18;
    Resync resync = 19;
  }
}

message Hello {
  string ticket = 1;
  string world_id = 2;
  uint32 protocol_version = 3;
  int64 last_seq = 4;
  string locale = 5;
  repeated string capabilities = 6;
}

message Welcome {
  string session_id = 1;
  string user_id = 2;
  string role = 3;
  int64 seq = 4;
  string snapshot_ref = 5;
  int64 delta_from = 6;
}

message Intent {
  uint32 request_id = 1;
  string kind = 2;
  string world_id = 3;
  bytes payload = 4;
}

message Ack {
  uint32 request_id = 1;
  int64 seq = 2;
  bytes result = 3;
}

message Event {
  int64 seq = 1;
  string kind = 2;
  string world_id = 3;
  string scene_id = 4;
  bytes payload = 5;
}

message Ephemeral {
  string kind = 1;
  string key = 2;
  string world_id = 3;
  string scene_id = 4;
  bytes payload = 5;
}

message Error {
  uint32 request_id = 1;
  string code = 2;
  string message_key = 3;
  map<string, string> params = 4;
}

message Ping {
  int64 sent_at_unix_ms = 1;
}

message Pong {
  int64 sent_at_unix_ms = 1;
}

message Resync {
  string reason = 1;
  int64 from_seq = 2;
}

message Pong {
  int64 sent_at_unix_ms = 1;
}

message Resync {
  string reason = 1;
  int64 from_seq = 2;
}
